[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshak-protocol"
version = "1.0.0"
description = "Autonomous Zero-Click Emergency SOS, Cell-Tower Drone Dispatch, and Evidence Vault"
authors = [{ name = "Rakshak Core Team", email = "core@rakshak.civic.dev" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0",
    "pydantic>=1.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/transparentgov/rakshak-protocol"
Repository = "https://github.com/transparentgov/rakshak-protocol.git"
Documentation = "https://github.com/transparentgov/rakshak-protocol/tree/main/docs"
Bug-Tracker = "https://github.com/transparentgov/rakshak-protocol/issues"

[tool.setuptools.packages.find]
include = ["edge_device*", "server*", "drone_station*", "simulations*"]
